<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mailzeet SDK – Dev Example</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <h1>Mailzeet SDK – Test</h1>

    <form id="email-form">
      <input type="email" id="to" placeholder="Recipient email" required />
      <input type="email" id="Cc" placeholder="CC"/>
      <input type="email" id="Bcc" placeholder="BCC"/>
      <input type="email" id="replyTo" placeholder="Reply To"/>
      <input type="text" id="subject" placeholder="Subject" />
      <input type="text" id="template_id" placeholder="Template ID"/>
      <input type="text" name="text" id="text" placeholder="Text content"/>
      <textarea id="content" placeholder="HTML content"></textarea>
      <button type="submit">Send email</button>
    </form>

    <pre id="result"></pre>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
